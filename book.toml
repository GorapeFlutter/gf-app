[book]
title = "gf-app documentation"
authors = ["Gorapeflutter"]
language = "en"
src = "docs"

[build]
build-dir = "build/mdbook"

[preprocessor.tabs]
after = ["links", "mermaid"]

[preprocessor.mermaid]
command = "mdbook-mermaid"
after = ["links"]

[output.html]
additional-css = ["theme/tabs.css"]
additional-js = ["theme/tabs.js", "mermaid.min.js", "mermaid-init.js"]
