name: Build and deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "book.toml"
      - "docs/**"
      - "lib/**"
      - "android/app/src/main/kotlin/**"
      - "mermaid-init.js"
      - "mermaid.min.js"
      - "theme/**"
      - "scripts/docs/**"
      - ".github/workflows/mdbook-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "book.toml"
      - "docs/**"
      - "lib/**"
      - "android/app/src/main/kotlin/**"
      - "mermaid-init.js"
      - "mermaid.min.js"
      - "theme/**"
      - "scripts/docs/**"
      - ".github/workflows/mdbook-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook and preprocessors
        run: |
          cargo install mdbook --version 0.5.4 --locked
          cargo install mdbook-tabs --version 1.0.4 --locked
          cargo install mdbook-mermaid --version 0.17.1 --locked

      - name: Verify GF ID source links
        env:
          GF_DOCS_GITHUB_ROOT: https://github.com/GorapeFlutter/gf-app/
          GF_DOCS_GITHUB_REF: main
        run: python3 scripts/docs/link_gf_ids.py --check

      - name: Build mdBook
        run: ./scripts/docs/build-book.sh

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/mdbook

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
